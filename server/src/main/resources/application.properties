# PAM backend template - Java/Spring Boot port.
# (.properties files are read as ISO-8859-1, so comments here stay ASCII.)

spring.application.name=backend

# Port from the PORT env variable (default 8080) - same as every port.
server.port=${PORT:8080}

# SQLite: app.db is created automatically on first start (schema in Db.java).
spring.datasource.url=jdbc:sqlite:app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer - one pooled connection avoids SQLITE_BUSY
# and makes "SELECT last_insert_rowid()"-style reasoning trivial.
spring.datasource.hikari.maximum-pool-size=1

# Upload cap: 5 MB (5242880 bytes), checked on Content-Length (rejected
# immediately) AND while counting bytes when the body is chunked. Over the
# cap Tomcat throws MaxUploadSizeExceededException, which Errors.java maps
# to 400 VALIDATION_ERROR - the contract deliberately has no 413.
spring.servlet.multipart.max-file-size=5242880B
spring.servlet.multipart.max-request-size=5242880B
# After refusing an upload Tomcat still has to drain the request body to
# deliver the 400 cleanly; the default gives up after 2 MB and the client
# sees a reset connection instead of the response.
server.tomcat.max-swallow-size=-1

# No Whitelabel page and no static-resource serving: every unknown route
# falls through to Errors.java => 404 {"error":{...}}.
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
